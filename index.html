<div class="flex items-center gap-3"><a href="#admission" class="hidden sm:inline-block bg-gold text-navy font-bold rounded-full px-5 py-2 text-sm hover:scale-105 transition">Join Academy</a><button class="lg:hidden text-2xl" aria-label="Menu" onClick=${()=>setO(!o)}>${o?"×":"☰"}</button></div></div>
${o&&h`<div class="lg:hidden bg-navy/95 px-5 pb-5 grid gap-3">${links.map(l=>h`<a key=${l} href=${"#"+idOf(l)} onClick=${()=>setO(false)} class="py-1">${l}</a>`)}<a href="#admission" onClick=${()=>setO(false)} class="bg-gold text-navy font-bold rounded-full px-5 py-2 text-center">Join Academy</a></div>`}</header>`}

<div><p class="rise text-gold font-semibold mb-3">${NAME}</p><h1 class="rise d1 text-6xl md:text-8xl font-extrabold leading-[.95]">TRAIN HARD.<br/>PLAY SMART.<br/>BECOME A CHAMPION.</h1><p class="rise d2 text-lg text-white/80 mt-6 max-w-md">Professional Cricket Coaching for the Next Generation of Champions.</p>
<div class="rise d3 flex flex-wrap gap-3 mt-8"><${Btn} href="#admission">Join Our Academy<//><${Btn} href="#programs" alt=${true}>Explore Programs<//></div></div>
<div class="relative h-72 md:h-[26rem] grid place-items-center"><div class="absolute w-72 h-72 md:w-96 md:h-96 rounded-full bg-cg/30 blur-3xl"></div><div class="ball text-[9rem] md:text-[13rem] leading-none drop-shadow-2xl" aria-hidden="true">🏏</div></div></div>
${IMG.hero&&h`<img src=${IMG.hero} alt="" class="absolute inset-0 w-full h-full object-cover opacity-40"/>`}<div class="absolute bottom-4 left-0 right-0 px-5"><div class="max-w-6xl mx-auto glass rounded-2xl grid grid-cols-2 md:grid-cols-4 text-center py-4">${[["500+","Players Trained"],["15+","Expert Coaches"],["10+","Years Experience"],["50+","Tournament Wins"]].map(([n,l])=>h`<div key=${l}><div class="fd text-4xl font-extrabold text-gold">${n}</div><div class="text-xs text-white/70">${l}</div></div>`)}</div></div></section>`;

const About=()=>h`<${Sec} id="about" alt=${true} t="About the Academy" s="A coaching culture built on discipline, skill and love of the game."><div class="grid md:grid-cols-3 gap-5">
${[["Our Vision","To build confident, technically sound cricketers who can compete at district, state and national levels."],["Our Mission","To give every student structured coaching, match exposure and the mindset to grow on and off the field."],["Training Philosophy","Basics first, then game sense, then pressure. Every session has a clear skill goal and feedback."]].map(([a,b])=>h`<div key=${a} class="bg-card rounded-2xl p-6 border border-white/10"><h3 class="text-2xl font-bold text-gold">${a}</h3><p class="text-white/75 mt-2">${b}</p></div>`)}</div>
<h3 class="text-3xl font-bold mt-12 mb-4">Why Choose Us</h3><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${["Certified, experienced coaches","Small batches, personal attention","Match practice every week","Fitness and video analysis"].map(x=>h`<div key=${x} class="glass rounded-xl p-4 flex gap-3"><span class="text-cg">✔</span>${x}</div>`)}</div><//>`;

const Programs=({pick,hid=[]})=>h`<${Sec} id="programs" t="Coaching Programs" s="Choose the path that fits the player’s age and goals."><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">${progs.map(([e,t,d],i)=>hid.includes(t)?null:h`<div key=${t} class="lift bg-card rounded-2xl overflow-hidden border border-white/10"><div class="h-36"><${Pic} src=${IMG.progs[i]} i=${i} e=${e}/></div><div class="p-5"><h3 class="text-2xl font-bold">${t}</h3><p class="text-white/70 text-sm mt-1 mb-4">${d}</p><a href="#admission" onClick=${()=>pick(t)} class="text-gold font-semibold hover:underline">Learn More</a></div></div>`)}</div><//>`;

const Coaches=()=>{const[c,setC]=useState(null);return h`<${Sec} id="coaches" alt=${true} t=${h`Expert Coaches<${Demo}/>`} s="Learn from experienced, certified coaches."><div class="grid md:grid-cols-3 gap-6">${coaches.map((x,i)=>h`<div key=${i} class="lift bg-card rounded-2xl p-6 border border-white/10 text-center"><div class="w-28 h-28 rounded-full mx-auto overflow-hidden"><${Pic} src=${IMG.coaches[i]} i=${i+2} e="🧑‍🏫" big="text-5xl"/></div><h3 class="text-2xl font-bold mt-4">${x[0]}</h3><p class="text-gold text-sm">${x[2]}</p><p class="text-white/70 text-sm">Experience: ${x[1]}</p><button onClick=${()=>setC(x)} class="mt-4 rounded-full border border-white/30 px-5 py-2 text-sm hover:bg-white/10">View Profile</button></div>`)}</div>
${c&&h`<${Modal} onClose=${()=>setC(null)}><h3 class="text-3xl font-bold">${c[0]}</h3><p class="text-gold">${c[2]} · ${c[1]}</p><p class="mt-3 text-white/75">${c[3]}</p><//>`}<//>`};

const Facilities=()=>h`<${Sec} id="facilities" t="Training Facilities" s="Everything a serious cricketer needs to train, play and recover."><div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${facs.map(([e,t],i)=>h`<div key=${t} class="lift glass rounded-2xl p-5 text-center"><div class="text-4xl mb-2">${e}</div><div class="font-semibold">${t}</div></div>`)}</div><//>`;

const Schedule=()=>h`<${Sec} id="schedule" alt=${true} t=${h`Training Schedule<${Demo}/>`} s="Pick the batch that fits your school or work routine."><div class="overflow-x-auto rounded-2xl border border-white/10"><table class="w-full text-left min-w-[520px]"><thead class="bg-cg/20"><tr><th class="p-4">Batch</th><th class="p-4">Days</th><th class="p-4">Time</th></tr></thead><tbody>${sched.map(r=>h`<tr key=${r[0]} class="border-t border-white/10 hover:bg-white/5"><td class="p-4 font-semibold">${r[0]}</td><td class="p-4">${r[1]}</td><td class="p-4 text-gold">${r[2]}</td></tr>`)}</tbody></table></div><//>`;

const Gallery=({extra=[]})=>{const[f,setF]=useState("All"),[l,setL]=useState(null);const list=[...gal.map((g,i)=>[...g,i]),...extra.map((x,j)=>[x.category,"🏏",100+j,x.image_url])].filter(g=>f==="All"||g[0]===f);

const field="w-full bg-navy border border-white/20 rounded-lg px-4 py-3 focus:border-cg";
function Admission({pref}){
const init={name:"",dob:"",age:"",parent:"",mobile:"",email:"",address:"",exp:"",program:"",batch:""};
const[v,setV]=useState(init),[e,setE]=useState({}),[ok,setOk]=useState(false);
useEffect(()=>{if(pref)setV(x=>({...x,program:pref}))},[pref]);
const set=k=>ev=>setV({...v,[k]:ev.target.value});
const val=()=>{const r={};if(v.name.trim().length<3)r.name="Enter the student’s full name.";if(!v.dob)r.dob="Select date of birth.";if(!(v.age>=4&&v.age<=40))r.age="Enter an age between 4 and 40.";if(v.parent.trim().length<3)r.parent="Enter the parent’s name.";if(!/^[6-9]\d{9}$/.test(v.mobile))r.mobile="Enter a valid 10-digit mobile number.";if(!/^\S+@\S+\.\S+$/.test(v.email))r.email="Enter a valid email address.";if(v.address.trim().length<5)r.address="Enter the full address.";if(!v.exp)r.exp="Select experience.";if(!v.program)r.program="Select a program.";if(!v.batch)r.batch="Select a batch.";return r};
const[busy,setBusy]=useState(false),[err,setErr]=useState("");const submit=async ev=>{ev.preventDefault();const r=val();setE(r);if(Object.keys(r).length)return;setBusy(true);setErr("");try{await api("/rest/v1/enquiries",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({student_name:v.name.trim(),dob:v.dob,age:+v.age,parent_name:v.parent.trim(),mobile:v.mobile,email:v.email.trim(),address:v.address.trim(),experience:v.exp,program:v.program,batch:v.batch})});setOk(true)}catch(x){setErr("Could not send the enquiry. Please try again or use WhatsApp.")}setBusy(false)};
const msg=encodeURIComponent(`Hello ${NAME}, I want to enquire about admission.\nStudent: ${v.name||"-"}\nProgram: ${v.program||"-"}\nBatch: ${v.batch||"-"}`);
const F=(k,label,props={})=>h`<div><label class="text-sm text-white/70">${label}</label><input class=${field} value=${v[k]} onInput=${set(k)} ...${props}/>${e[k]&&h`<p class="text-red-400 text-xs mt-1">${e[k]}</p>`}</div>`;
const S=(k,label,opts)=>h`<div><label class="text-sm text-white/70">${label}</label><select class=${field} value=${v[k]} onChange=${set(k)}><option value="">Select</option>${opts.map(o=>h`<option key=${o}>${o}</option>`)}</select>${e[k]&&h`<p class="text-red-400 text-xs mt-1">${e[k]}</p>`}</div>`;
return h`<${Sec} id="admission" t="Admission Enquiry" s="Fill in the details and the academy will call you to book a free trial."><div class="max-w-3xl glass rounded-2xl p-6 md:p-8">
${ok?h`<div class="text-center py-10"><div class="text-6xl">✅</div><h3 class="text-3xl font-bold mt-3">Enquiry sent</h3><p class="text-white/70 mt-2">Thank you, ${v.parent}. The academy will contact you on ${v.mobile}.</p><div class="mt-6 flex gap-3 justify-center flex-wrap"><${Btn} href=${"https://wa.me/"+WA+"?text="+msg}>Continue on WhatsApp<//><button onClick=${()=>{setOk(false);setV(init)}} class="rounded-full border border-white/30 px-6 py-3">New enquiry</button></div></div>`:
h`<form onSubmit=${submit} noValidate class="grid sm:grid-cols-2 gap-4">${F("name","Student Full Name")}${F("dob","Date of Birth",{type:"date"})}${F("age","Age",{type:"number"})}${F("parent","Parent Name")}${F("mobile","Mobile Number",{type:"tel",maxLength:10})}${F("email","Email",{type:"email"})}
<div class="sm:col-span-2">${F("address","Address")}</div>${S("exp","Previous Cricket Experience",["No experience","Less than 1 year","1–3 years","3+ years"])}${S("program","Preferred Coaching Program",progs.map(p=>p[1]))}${S("batch","Preferred Training Batch",sched.map(s=>s[0]))}
${err&&h`<p class="sm:col-span-2 text-red-400 text-sm">${err}</p>`}<div class="sm:col-span-2 flex flex-wrap gap-3 mt-2"><button disabled=${busy} class="bg-cg hover:bg-green-500 disabled:opacity-60 rounded-full px-8 py-3 font-semibold">${busy?"Sending…":"Submit Enquiry"}</button><a target="_blank" rel="noopener" href=${"https://wa.me/"+WA+"?text="+msg} class="rounded-full border border-white/30 px-8 py-3 hover:bg-white/10">Enquire on WhatsApp</a></div></form>`}</div><//>`}

const Testimonials=()=>h`<${Sec} id="testimonials" alt=${true} t=${h`What People Say<${Demo}/>`} s="Hear from students, parents and former players."><div class="grid md:grid-cols-3 gap-5">${tests.map(([w,t])=>h`<div key=${w} class="bg-card rounded-2xl p-6 border border-white/10"><div class="text-gold">★★★★★</div><p class="mt-3 text-white/80">${t}</p><p class="mt-4 font-semibold">${w}</p></div>`)}</div><//>`;

const Fees=()=>h`<${Sec} id="fees" t=${h`Fees & Membership<${Demo}/>`} s="Choose the plan that suits your training goals."><div class="grid md:grid-cols-3 gap-6">${fees.map(([n,p,u],i)=>h`<div key=${n} class=${"lift rounded-2xl p-7 border "+(i===1?"border-gold bg-card":"border-white/10 bg-card")}>${i===1&&h`<div class="text-xs font-bold text-navy bg-gold rounded px-2 py-0.5 inline-block mb-2">POPULAR</div>`}<h3 class="text-2xl font-bold">${n} Membership</h3><div class="fd text-5xl font-extrabold text-gold mt-3">${p}</div><div class="text-white/60 text-sm">${u}</div><ul class="mt-4 text-sm text-white/80 grid gap-1"><li>✔ Regular batch coaching</li><li>✔ Match practice</li><li>✔ Progress feedback</li></ul><a href="#admission" class="mt-5 block text-center bg-cg hover:bg-green-500 rounded-full py-2.5 font-semibold">Choose Plan</a></div>`)}</div><//>`;

const FAQ=()=>{const[o,setO]=useState(0);return h`<${Sec} id="faq" alt=${true} t="Frequently Asked Questions" s="Quick answers for new students and parents."><div class="max-w-3xl grid gap-3">${faqs.map(([q,a],i)=>h`<div key=${q} class="bg-card rounded-xl border border-white/10"><button class="w-full text-left p-4 font-semibold flex justify-between gap-3" aria-expanded=${o===i} onClick=${()=>setO(o===i?-1:i)}>${q}<span class="text-gold">${o===i?"–":"+"}</span></button>${o===i&&h`<p class="px-4 pb-4 text-white/75">${a}</p>`}</div>`)}</div><//>`};

function Contact(){const[v,setV]=useState({n:"",m:"",t:""}),[e,setE]=useState(""),[ok,setOk]=useState(false);
const go=async ev=>{ev.preventDefault();if(v.n.trim().length<3)return setE("Enter your name.");if(!/^[6-9]\d{9}$/.test(v.m))return setE("Enter a valid 10-digit mobile number.");if(v.t.trim().length<5)return setE("Write a short message.");setE("");try{await api("/rest/v1/contacts",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({name:v.n.trim(),mobile:v.m,message:v.t.trim()})});setOk(true)}catch(x){setE("Could not send. Please try again or use WhatsApp.")}};
return h`<${Sec} id="contact" t="Contact Us" s="Visit, call or message us to book a trial session."><div class="grid md:grid-cols-2 gap-8"><div class="grid gap-3 content-start">${[["📍","Academy Address: Street, City, State – PIN"],["📞","Phone: +91 99999 99999"],["💬","WhatsApp: +91 99999 99999"],["✉️","Email: info@youracademy.example"]].map(([i,t])=>h`<div key=${t} class="glass rounded-xl p-4">${i} ${t}</div>`)}
<div class="flex flex-wrap gap-3"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/cricket+academy" class="rounded-full bg-cg px-5 py-2.5 font-semibold">Open Google Maps</a><a target="_blank" rel="noopener" href="https://www.instagram.com/" class="rounded-full border border-white/30 px-5 py-2.5">Instagram</a><a target="_blank" rel="noopener" href="https://www.facebook.com/" class="rounded-full border border-white/30 px-5 py-2.5">Facebook</a></div></div>
<form onSubmit=${go} class="glass rounded-2xl p-6 grid gap-3">${ok?h`<p class="text-center py-8 text-xl">✅ Message sent. We will reply soon.</p>`:h`<input class=${field} placeholder="Your name" value=${v.n} onInput=${x=>setV({...v,n:x.target.value})}/><input class=${field} placeholder="Mobile number" inputMode="numeric" maxLength="10" value=${v.m} onInput=${x=>setV({...v,m:x.target.value})}/><textarea class=${field} rows="4" placeholder="Message" value=${v.t} onInput=${x=>setV({...v,t:x.target.value})}></textarea>${e&&h`<p class="text-red-400 text-sm">${e}</p>`}<button class="bg-gold text-navy font-bold rounded-full py-3">Send Message</button>`}</form></div><//>`}

const Footer=()=>h`<footer class="bg-[#050c16] px-5 pt-12 pb-24"><div class="max-w-6xl mx-auto grid md:grid-cols-4 gap-8 text-sm text-white/70"><div><${Logo}/><p class="mt-3">Professional cricket coaching for the next generation.</p></div>
<div><h4 class="font-bold text-white mb-2">Quick Links</h4><div class="grid gap-1">${links.map(l=>h`<a key=${l} href=${"#"+idOf(l)} class="hover:text-gold">${l}</a>`)}</div></div>
<div><h4 class="font-bold text-white mb-2">Programs</h4><div class="grid gap-1">${progs.slice(0,5).map(p=>h`<a key=${p[1]} href="#programs" class="hover:text-gold">${p[1]}</a>`)}</div></div>
<div><h4 class="font-bold text-white mb-2">Contact</h4><p>Street, City, State</p><p>+91 99999 99999</p><p>info@youracademy.example</p><p class="mt-2 flex gap-3"><a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a><a href="https://www.facebook.com/" target="_blank" rel="noopener">Facebook</a></p><a href="#admin" class="inline-block mt-3 text-gold">Admin Login</a></div></div>
<p class="text-center text-xs text-white/40 mt-10">© 2026 ${NAME}. All rights reserved.</p></footer>`;

const WaFloat=()=>h`<a href=${"https://wa.me/"+WA+"?text="+encodeURIComponent("Hello, I want to know about cricket coaching.")} target="_blank" rel="noopener" aria-label="Chat on WhatsApp" class="fixed left-4 z-50 w-14 h-14 rounded-full bg-[#25D366] grid place-items-center text-2xl shadow-xl hover:scale-110 transition" style=${{bottom:"calc(16px + env(safe-area-inset-bottom,0px))"}}>💬</a>`;

function Admin(){
const[tab,setTab]=useState("Dashboard"),[tok,setTok]=useState(""),[em,setEm]=useState(""),[pw,setPw]=useState(""),[ae,setAe]=useState(""),[D,setD]=useState({enq:[],stu:[],con:[],gal:[],pro:[]}),[sf,setSf]=useState({name:"",program:"",batch:"",mobile:""}),[gf,setGf]=useState({category:"Training"}),[up,setUp]=useState(false);
const T={enq:"enquiries?select=*&order=created_at.desc",stu:"students?select=*&order=created_at.desc",con:"contacts?select=*&order=created_at.desc",gal:"gallery?select=*&order=created_at.desc",pro:"programs?select=*&order=title"};
const load=async t=>{const o={};let bad=false;for(const k in T){try{o[k]=await api("/rest/v1/"+T[k],{},t)}catch(x){o[k]=[];bad=true}}setD(o);if(bad)setAe("Some data could not load. Run the latest supabase/schema.sql in Supabase.")};
const login=async ev=>{ev.preventDefault();setAe("");try{const r=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:em,password:pw})});setTok(r.access_token);load(r.access_token)}catch(x){setAe("Login failed. Check email and password.")}};
const call=async(m,p,b)=>{setAe("");try{await api("/rest/v1/"+p,{method:m,headers:{Prefer:"return=minimal"},body:b?JSON.stringify(b):undefined},tok);await load(tok);return true}catch(x){setAe("Action failed: "+String(x.message).slice(0,140))}};
const shrink=f=>new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error("Bad image")),"image/jpeg",.85)};i.onerror=()=>no(new Error("Could not read image"));i.src=u});
const upl=async e=>{const fs=[...e.target.files];e.target.value="";if(!fs.length)return;setUp(true);setAe("");try{for(const f of fs){const b=await shrink(f),p=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";const r=await fetch(SB+"/storage/v1/object/gallery/"+p,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+tok,"Content-Type":"image/jpeg"},body:b});if(!r.ok)throw new Error(await r.text());await api("/rest/v1/gallery",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({category:gf.category,image_url:SB+"/storage/v1/object/public/gallery/"+p})},tok)}await load(tok)}catch(x){setAe("Upload failed. Run the storage SQL in Supabase first. "+String(x.message).slice(0,100))}setUp(false)};
const nxt={New:"Contacted",Contacted:"Admitted",Admitted:"New"};
const dt=x=>new Date(x).toLocaleDateString("en-IN");
const tabs=["Dashboard","Enquiries","Messages","Students","Gallery","Programs"];
const stat=(a,b)=>h`<div key=${b} class="bg-card rounded-2xl p-5 border border-white/10"><div class="fd text-4xl font-extrabold text-gold">${a}</div><div class="text-sm text-white/70">${b}</div></div>`;
const Tbl=(heads,rows)=>rows.length?h`<div class="overflow-x-auto rounded-xl border border-white/10"><table class="w-full text-left min-w-[520px]"><thead class="bg-white/5 text-sm"><tr>${heads.map(x=>h`<th key=${x} class="p-3">${x}</th>`)}</tr></thead><tbody>${rows.map((r,i)=>h`<tr key=${i} class="border-t border-white/10">${r.map((c,j)=>h`<td key=${j} class="p-3">${c}</td>`)}</tr>`)}</tbody></table></div>`:h`<p class="text-white/60">Nothing here yet.</p>`;
const del=(t,id)=>h`<button onClick=${()=>call("DELETE",t+"?id=eq."+id)} class="text-red-400 text-sm">Delete</button>`;
const delImg=g=>h`<button onClick=${()=>{const m=g.image_url.split("/object/public/gallery/")[1];if(m)fetch(SB+"/storage/v1/object/gallery/"+m,{method:"DELETE",headers:{apikey:KEY,Authorization:"Bearer "+tok}}).catch(()=>{});call("DELETE","gallery?id=eq."+g.id)}} class="text-red-400 text-sm">Delete</button>`;
const st=r=>h`<button onClick=${()=>call("PATCH","enquiries?id=eq."+r.id,{status:nxt[r.status]})} class="rounded-full bg-gold text-navy text-xs font-bold px-3 py-1">${r.status}</button>`;
if(!tok)return h`<div class="min-h-screen grid place-items-center p-5"><form onSubmit=${login} class="glass rounded-2xl p-6 w-full max-w-sm grid gap-3"><${Logo}/><h2 class="text-3xl font-bold">Admin Login</h2><input class=${field} type="email" placeholder="Email" value=${em} onInput=${x=>setEm(x.target.value)}/><input class=${field} type="password" placeholder="Password" value=${pw} onInput=${x=>setPw(x.target.value)}/>${ae&&h`<p class="text-red-400 text-sm">${ae}</p>`}<button class="bg-cg rounded-full py-3 font-semibold">Sign in</button><a href="#top" class="text-gold text-center text-sm">← Back to website</a></form></div>`;
return h`<div class="min-h-screen md:flex"><aside class="md:w-60 bg-[#050c16] p-5 md:min-h-screen"><${Logo}/><p class="text-xs text-white/50 mt-1">Admin dashboard</p><nav class="flex md:grid gap-2 mt-5 overflow-x-auto">${tabs.map(t=>h`<button key=${t} onClick=${()=>setTab(t)} class=${"text-left rounded-lg px-4 py-2 whitespace-nowrap "+(tab===t?"bg-cg":"hover:bg-white/10")}>${t}</button>`)}<button onClick=${()=>load(tok)} class="text-left rounded-lg px-4 py-2 whitespace-nowrap text-white/70">Refresh</button><a href="#top" class="rounded-lg px-4 py-2 text-gold whitespace-nowrap">← View website</a></nav></aside>
<main class="flex-1 p-5 md:p-8 min-w-0"><h2 class="text-4xl font-extrabold mb-4">${tab}</h2>${ae&&h`<p class="text-red-400 text-sm mb-4">${ae}</p>`}
${tab==="Dashboard"&&h`<div><div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${[stat(D.stu.length,"Total Students"),stat(D.enq.filter(x=>x.status==="New").length,"New Enquiries"),stat(D.enq.length,"All Enquiries"),stat(D.con.length,"Messages")]}</div><h3 class="text-2xl font-bold mt-8 mb-3">Recent Registrations</h3>${Tbl(["Student","Program","Status","Date"],D.enq.slice(0,5).map(r=>[r.student_name,r.program,r.status,dt(r.created_at)]))}</div>`}
${tab==="Enquiries"&&h`<div>${Tbl(["Student","Parent · Mobile · Email","Program · Batch","Status","Date"],D.enq.map(r=>[r.student_name+" ("+r.age+")",r.parent_name+" · "+r.mobile+" · "+r.email,r.program+" · "+r.batch,st(r),dt(r.created_at)]))}<p class="text-xs text-white/50 mt-2">Tap a status to move it: New, Contacted, Admitted.</p></div>`}
${tab==="Messages"&&Tbl(["Name","Mobile","Message","Date"],D.con.map(r=>[r.name,r.mobile,r.message,dt(r.created_at)]))}
${tab==="Students"&&h`<div><form class="grid sm:grid-cols-5 gap-2 mb-5" onSubmit=${async e=>{e.preventDefault();if(sf.name.trim().length<3)return setAe("Enter the student name.");if(await call("POST","students",sf))setSf({name:"",program:"",batch:"",mobile:""})}}><input class=${field} placeholder="Name" value=${sf.name} onInput=${e=>setSf({...sf,name:e.target.value})}/><select class=${field} value=${sf.program} onChange=${e=>setSf({...sf,program:e.target.value})}><option value="">Program</option>${progs.map(p=>h`<option key=${p[1]}>${p[1]}</option>`)}</select><select class=${field} value=${sf.batch} onChange=${e=>setSf({...sf,batch:e.target.value})}><option value="">Batch</option>${sched.map(s=>h`<option key=${s[0]}>${s[0]}</option>`)}</select><input class=${field} placeholder="Mobile" value=${sf.mobile} onInput=${e=>setSf({...sf,mobile:e.target.value})}/><button class="bg-cg rounded-lg font-semibold py-3">Add student</button></form>${Tbl(["Name","Program","Batch","Mobile",""],D.stu.map(r=>[r.name,r.program,r.batch,r.mobile,del("students",r.id)]))}</div>`}
${tab==="Gallery"&&h`<div><div class="grid sm:grid-cols-3 gap-2 mb-5"><select class=${field} value=${gf.category} onChange=${e=>setGf({...gf,category:e.target.value})}>${cats.map(c=>h`<option key=${c}>${c}</option>`)}</select><label class=${"sm:col-span-2 bg-cg rounded-lg font-semibold py-3 text-center cursor-pointer "+(up?"opacity-60":"")}>${up?"Uploading…":"Upload images"}<input type="file" accept="image/*" multiple class="hidden" disabled=${up} onChange=${upl}/></label></div><div class="grid grid-cols-2 md:grid-cols-4 gap-3">${D.gal.map(g=>h`<div key=${g.id} class="bg-card rounded-xl overflow-hidden border border-white/10"><div class="aspect-square"><${Pic} src=${g.image_url} i=${1} e="🏏"/></div><div class="p-2 flex justify-between text-sm"><span>${g.category}</span>${delImg(g)}</div></div>`)}</div>${!D.gal.length&&h`<p class="text-white/60">No images added yet.</p>`}</div>`}
${tab==="Programs"&&h`<div class="grid gap-3 max-w-xl">${D.pro.map(p=>h`<div key=${p.title} class="bg-card rounded-xl p-4 flex justify-between items-center border border-white/10"><span>${p.title}</span><button onClick=${()=>call("PATCH","programs?title=eq."+encodeURIComponent(p.title),{active:!p.active})} class=${"rounded-full px-4 py-1 text-sm "+(p.active?"bg-cg":"bg-white/15")}>${p.active?"Showing":"Hidden"}</button></div>`)}${!D.pro.length&&h`<p class="text-white/60">No programs found. Run the latest supabase/schema.sql.</p>`}</div>`}
</main></div>`}

function App(){
const[load,setLoad]=useState(true),[adm,setAdm]=useState(location.hash==="#admin"),[pref,setPref]=useState(""),[pub,setPub]=useState({hid:[],gal:[]});
useEffect(()=>{const t=setTimeout(()=>setLoad(false),900);const f=()=>setAdm(location.hash==="#admin");addEventListener("hashchange",f);return()=>{clearTimeout(t);removeEventListener("hashchange",f)}},[]);
useEffect(()=>{if(!adm&&!load){const id=location.hash.slice(1);const el=id&&document.getElementById(id);if(el)el.scrollIntoView()}},[adm,load]);
useEffect(()=>{api("/rest/v1/programs?select=*").then(p=>setPub(x=>({...x,hid:p.filter(a=>!a.active).map(a=>a.title)}))).catch(()=>{});api("/rest/v1/gallery?select=*&order=created_at.desc").then(g=>setPub(x=>({...x,gal:g}))).catch(()=>{})},[]);
if(load)return h`<div class="fixed inset-0 grid place-items-center bg-navy z-[80]"><div class="text-center"><div class="text-6xl ball">🏏</div><p class="fd text-2xl mt-4 tracking-widest">LOADING</p></div></div>`;
if(adm)return h`<${Admin}/>`;
return h`<div><${Nav}/><main><${Hero}/><${About}/><${Programs} pick=${setPref} hid=${pub.hid}/><${Coaches}/><${Facilities}/><${Schedule}/><${Achievements}/><${Gallery} extra=${pub.gal}/><${Admission} pref=${pref}/><${Testimonials}/><${Fees}/><${FAQ}/><${Contact}/></main><${Footer}/><${WaFloat}/></div>`}
ReactDOM.createRoot(document.getElementById("root")).render(h`<${App}/>`);
</script>
</body>
</html>
